name: CI

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in CI pushes, so the checkout keeps no git credentials.
          persist-credentials: false

      # Every package here compiles a Rust crate to wasm. The generated
      # `src/wasm.generated.ts` is not committed, so nothing — not even the
      # type-check — works without a toolchain that can hit this target.
      - name: Setup Rust with the wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/*/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/*/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Build first: it runs `build:wasm`, which emits the `wasm.generated.ts`
      # that both the type-check and the tests import.
      - name: Build
        run: vp run -r build

      - name: Check (format, lint, types)
        run: vp check

      - name: Test
        run: vp run -r test
