name: CI

# One workflow, one command: `vp run ci`, the task in vite.config.ts that
# builds, checks and tests every package. Run it locally to get the same
# verdict. It runs here on Node's LTS and current release lines, one check per
# line: `ci (node lts)` and `ci (node latest)`.

on:
  pull_request:
  push:
    branches:
      - trunk
  workflow_dispatch:

# A newer push to a pull request supersedes the run before it. Runs on `trunk`
# are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  ci:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts, latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in CI pushes, so the checkout keeps no git credentials.
          persist-credentials: false

      # Only a cache: the crates are compiled by the `ci` task, and the wasm
      # target is installed by rustup from rust-toolchain.toml when it does.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/*/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/*/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run the ci task
        run: vp run ci
