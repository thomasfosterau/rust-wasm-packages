name: Auto-assign

# Assigns each new pull request to the owner, so nothing sits unowned.
# Dependabot's pull requests are assigned by .github/dependabot.yml instead,
# and ones that already have an assignee are left alone.

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review

# No permissions by default; the job opts into exactly what it needs.
permissions: {}

jobs:
  assign:
    name: Assign the owner
    if: github.actor != 'dependabot[bot]' && join(github.event.pull_request.assignees.*.login) == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # No checkout: the job runs no code from the pull request. Every value
      # reaches the script through `env`, never by template expansion.
      - name: Assign the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee thomasfosterau
