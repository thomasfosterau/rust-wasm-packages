# pnpm workspace for the Rust-to-WebAssembly package family.
#
# Each package pairs a Rust crate (`src/lib.rs` + `Cargo.toml`) with a thin
# TypeScript wrapper. The crate is compiled to `wasm32-unknown-unknown` and
# embedded in the wrapper as a base64 string literal — see
# `packages/argon2/scripts/build-wasm.ts` for why a string constant rather than
# an asset import.
#
# Building therefore needs a Rust toolchain with the `wasm32-unknown-unknown`
# target installed. `.github/workflows/ci.yml` sets that up; locally:
#
#   rustup target add wasm32-unknown-unknown
packages:
  - "packages/*"

allowBuilds:
  # Pulled in transitively by the Vite+ toolchain; needs its postinstall to
  # fetch the native binary.
  esbuild: true
  # Only an optional perf accelerator for msgpackr (also transitive); the
  # pure-JS fallback is used when it isn't built.
  msgpackr-extract: false
# Written by `vp migrate`: `vite` is vite-plus's core under an npm alias and
# must always equal the `vite-plus` version (Dependabot cannot bump an alias,
# so move it with every vite-plus bump, e.g. by re-running `vp migrate`).
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
overrides:
  vite@*: "catalog:"
  # Advisory floors for transitive dev tooling, which `pnpm audit
  # --audit-level high` flags; nothing published reaches them (the argon2
  # package has no dependencies). js-yaml GHSA (maxTotalMergeKeys CPU use):
  # 3.x via @changesets/cli > @manypkg/get-packages > read-yaml-file, 4.x via
  # @changesets/parse. Each is a caret range on the major its dependents ask
  # for, so it never lifts them onto an untested major. Drop each once
  # @changesets/cli resolves a patched version on its own.
  "js-yaml@3": ^3.15.2
  "js-yaml@4": ^4.3.2
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
