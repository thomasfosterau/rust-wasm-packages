# pnpm workspace for the Rust-to-WebAssembly package family.
#
# Each package pairs a Rust crate (`src/lib.rs` + `Cargo.toml`) with a thin
# TypeScript wrapper. The crate is compiled to `wasm32-unknown-unknown` and
# embedded in the wrapper as a base64 string literal — see
# `packages/argon2/scripts/build-wasm.ts` for why a string constant rather than
# an asset import.
#
# Building therefore needs a Rust toolchain. `rust-toolchain.toml` names the
# `wasm32-unknown-unknown` target, so rustup installs it on first use.
packages:
  - "packages/*"

allowBuilds:
  # Pulled in transitively by the Vite+ toolchain; needs its postinstall to
  # fetch the native binary.
  esbuild: true
  # Only an optional perf accelerator for msgpackr (also transitive); the
  # pure-JS fallback is used when it isn't built.
  msgpackr-extract: false
  # Runs the real Workers runtime in the tests. Its binary arrives as a
  # platform-specific optional dependency; the postinstall is only a fallback
  # download for when that was skipped, and a test fails if the binary is absent.
  workerd: false
# Written by `vp migrate`: `vite` is vite-plus's core under an npm alias and
# must always equal the `vite-plus` version (Dependabot cannot bump an alias,
# so move it with every vite-plus bump, e.g. by re-running `vp migrate`).
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
