[package]
name = "thomasfosterau-argon2"
version = "0.1.0"
edition = "2021"
publish = false
description = "argon2id password hashing for Cloudflare Workers, compiled to wasm32-unknown-unknown"

[lib]
crate-type = ["cdylib"]

[dependencies]
# `password-hash` gives the self-describing PHC string encode/decode. No
# default features: the default pulls `rand_core` for salt generation, which
# would need `getrandom` — a syscall surface this target deliberately has none
# of. Salts are generated by the caller (Web Crypto) and passed in.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
